name: retailos

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retailos
    ports:
      - "5432:5432"
    volumes:
      - retailos_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retailos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Published on 16379 rather than the default 6379: on Windows hosts, TCP 6373-6472 can fall
    # inside the OS's reserved dynamic-port range (Hyper-V/WSL), leaving 6379 permanently unbindable
    # regardless of Docker's own state. 16379 avoids that range on every platform.
    # The container-internal port is unchanged (still 6379), so the healthcheck below is unaffected.
    # `.env.local.example` sets REDIS_URL to match — the two must stay in sync.
    ports:
      - "16379:6379"
    volumes:
      - retailos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - retailos_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  retailos_postgres_data:
  retailos_redis_data:
  retailos_minio_data:
