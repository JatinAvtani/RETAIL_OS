name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retailos
  S3_ENDPOINT: http://localhost:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin

jobs:
  # Fast, no-database checks first — fail here before paying for a Postgres service container.
  static:
    name: typecheck, lint, module boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` here - pnpm/action-setup reads it from package.json's "packageManager"
      # field automatically, and specifying both is a hard error ("Multiple versions of pnpm
      # specified"), which is what the first real CI run actually hit.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Module boundaries (dependency-cruiser)
        run: pnpm boundaries

      - name: Invariant scan (I1-I9)
        run: pnpm invariants

  # Real Postgres, real migrations, real RLS — the cross-tenant suite proves nothing on a mock.
  # Real Redis too — packages/session's tests exercise actual TTL/atomicity behavior, not a mock.
  integration:
    name: unit + integration (real Postgres, real Redis)
    runs-on: ubuntu-latest
    needs: static
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retailos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d retailos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # No `version:` here - pnpm/action-setup reads it from package.json's "packageManager"
      # field automatically, and specifying both is a hard error ("Multiple versions of pnpm
      # specified"), which is what the first real CI run actually hit.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # packages/storage's tests need a real S3-compatible endpoint, not a mock — a presigned URL
      # actually accepting a PUT only means something against a real server. Run as a plain `docker
      # run` step, not a job-level `services:` entry: GitHub Actions service containers cannot
      # override a job's command (only image/env/ports/options), and the MinIO image's default
      # command with no arguments just prints help text and exits rather than starting a server —
      # confirmed locally (`docker run --rm minio/minio:latest` exits 0 immediately, no server).
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      # ubuntu-latest ships postgresql-client preinstalled, so `psql` is available without an
      # install step. All three scripts are idempotent (CREATE EXTENSION / CREATE ROLE ... IF NOT
      # EXISTS), so re-running them on a warm database is safe.
      - name: Enable required Postgres extensions
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d retailos -f docker/postgres/init/01-extensions.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d retailos -f docker/postgres/init/02-app-role.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d retailos -f docker/postgres/init/03-sweeper-role.sql

      - name: Run migrations
        run: pnpm --filter @retailos/db db:migrate

      - name: Run concurrent-index migration
        run: pnpm --filter @retailos/db db:migrate:concurrent

      # packages/ai's Tesseract-provider tests each do two sequential `docker run` calls
      # (rasterize, then OCR), bounded at 90s per call. That ceiling already accounts for one cold
      # image pull, but without this step both calls can independently hit a cold pull on a given
      # runner, occasionally pushing a call just past the timeout — pre-pulling here means the
      # timed calls only ever pay real container-run cost, not registry-pull cost.
      - name: Pre-pull Tesseract/poppler OCR images
        run: |
          docker pull jitesoft/tesseract-ocr &
          docker pull minidocks/poppler &
          wait

      # apps/api's own runtime connection (apps/api/src/trpc/context.ts) must be the RLS-scoped
      # retailos_app role, never the job-level DATABASE_URL superuser (needed above for migrations
      # and for cross-tenant tests' own admin/seeding connection, which legitimately needs
      # superuser to write across two tenants). Without this override, the entire apps/api
      # cross-tenant suite runs against a connection that bypasses RLS via BYPASSRLS — a real,
      # previously-undetected gap: RLS was never actually
      # exercised in CI for apps/api, only application-layer checks were.
      - name: Unit + integration tests
        env:
          APP_DATABASE_URL: postgresql://retailos_app:retailos_app_local_only@localhost:5432/retailos
        run: pnpm test
