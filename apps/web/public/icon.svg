<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!--
    The Vyapaar mark as a favicon. This file cannot use the app's CSS variables — it renders in
    browser chrome, outside the page — so the palette is inlined as literal hex, and a media query
    swaps the ink for dark browser themes. The accent (#8A6A1F / #C9A24E) matches --color-accent in
    globals.css exactly; keep this file and components/logo.tsx in sync if the palette changes.
  -->
  <style>
    .bar { fill: #1C1B19; }
    .bar-accent { fill: #8A6A1F; }
    @media (prefers-color-scheme: dark) {
      .bar { fill: #EDE9E2; }
      .bar-accent { fill: #C9A24E; }
    }
  </style>
  <rect x="6" y="24" width="5" height="8" rx="2.5" class="bar" opacity="0.85" />
  <rect x="14" y="21" width="5" height="11" rx="2.5" class="bar" opacity="0.85" />
  <rect x="22" y="8" width="5" height="24" rx="2.5" class="bar-accent" />
  <rect x="30" y="23" width="5" height="9" rx="2.5" class="bar" opacity="0.85" />
</svg>
