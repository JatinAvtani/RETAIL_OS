<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!--
    The Vyapaar mark as a favicon. Deliberately NOT a copy of components/logo.tsx: browser chrome
    gives a favicon no theme context it can trust (prefers-color-scheme inside an SVG favicon is
    evaluated inconsistently across browsers, and often against the page rather than the tab bar),
    so this file commits to one opaque design that reads on any tab strip — a filled brass square
    (--color-accent's literal hex, #8A6A1F; keep in sync with globals.css) with light bars. Bars
    are 7px wide in a 40px viewBox (~3px at a real 16px tab size) — the logo's finer 5px bars
    dissolve into mush at that scale, which is why the favicon variant is thicker on purpose.
  -->
  <rect x="0" y="0" width="40" height="40" rx="9" fill="#8A6A1F" />
  <rect x="3.5" y="26" width="7" height="10" rx="2.5" fill="#EFE6D2" />
  <rect x="12.5" y="23" width="7" height="13" rx="2.5" fill="#EFE6D2" />
  <rect x="21.5" y="8" width="7" height="28" rx="2.5" fill="#FFFDF6" />
  <rect x="30.5" y="24" width="7" height="12" rx="2.5" fill="#EFE6D2" />
</svg>
